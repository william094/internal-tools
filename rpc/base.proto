syntax = "proto3";

package base;

option go_package = "./rpc";

message BaseResponse {
  string code = 1;
  string msg  = 2;
}

message BaseAuth {
  UserInfo user_info    = 1;
  string   access_token = 2;
  string   ip           = 3;
}

message BusinessError {
  int32  code = 1;
  string msg  = 2;
}

message UserInfo {
  uint64 uid       = 1;
  string nick_name = 2;
  string avatar    = 3;
  uint64 device_id = 4;
}

